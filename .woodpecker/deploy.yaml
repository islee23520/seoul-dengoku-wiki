# Deploy request lane for the WSL host (owner contract docs/repo-pg-orm.md).
# CI compiles the site from the COMMITTED renders/ snapshot only (no PostgreSQL, no secrets),
# then ASKS the host controller to deploy. An operator must approve (independent rebuild from
# this exact SHA + projection freshness gate) before anything is published.
when:
  - event: [push, manual]
    branch: main
labels:
  wsl: deploy
clone:
  git:
    image: woodpeckerci/plugin-git:2
    settings:
      lfs: true
      recursive: false
steps:
  - name: build
    image: bash
    commands:
      # Same node binary the approver's independent rebuild uses; compiles renders/ snapshot -> dist/.
      - /opt/linalab/node/bin/node deploy/compile-check.mjs
  - name: deploy-request
    image: bash
    environment:
      DEPLOY_REQUEST_TOKEN:
        from_secret: deploy_request_token
    commands:
      - bun /opt/linalab/wsl/deploy-approve/ci-request.ts --target seoul-wiki dist
