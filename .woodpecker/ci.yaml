when:
  - event: [manual, push]
steps:
  build:
    image: node:22-bookworm-slim
    commands:
      - cd viewer
      - npm ci
      - cd ..
      - node viewer/vendor/canon-tools/canon/materialize-gdd.mjs --gdd . --out /tmp/gdd-pages
      - cd viewer
      - GDD_PAGES_ROOT=/tmp/gdd-pages npm run build
