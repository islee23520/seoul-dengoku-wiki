when:
  - event: [push, pull_request, manual]

labels:
  platform: linux/amd64

clone:
  git:
    image: woodpeckerci/plugin-git:2
    settings:
      lfs: true
      recursive: false

steps:
  - name: compile-public-snapshot
    image: bash
    commands:
      # Local backend: the pinned host node (same binary the approver rebuilds with).
      - export PATH=/opt/linalab/node/bin:$PATH
      - npm ci --ignore-scripts
      # No database credentials or deployment action belongs in this lane.
      # The first reviewed snapshot is required; absence must fail closed.
      - node deploy/compile-check.mjs
      - node scripts/check-static-snapshot.mjs
      - node --test scripts/test-seed-sync.mjs scripts/test-migration-provenance.mjs scripts/test-public-snapshot.mjs scripts/test-static-snapshot.mjs
