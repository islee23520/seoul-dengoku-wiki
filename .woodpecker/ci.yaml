when:
  - event: [push, manual, pull_request]

labels:
  platform: linux/amd64

clone:
  git:
    image: woodpeckerci/plugin-git:2
    settings:
      lfs: true
      recursive: false

steps:
  - name: sqlite-authority
    image: node:26-bookworm-slim
    commands:
      - node deploy/check-lfs-inputs.mjs
      - apt-get update
      - apt-get install -y --no-install-recommends python3 python3-pip ca-certificates git
      - npm ci --ignore-scripts
      - npm run cast:verify -- --db data/canonical/wiki-cast.sqlite
