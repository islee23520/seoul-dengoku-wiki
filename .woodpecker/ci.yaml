when:
  - event: [push, pull_request, manual]

labels:
  platform: linux/amd64

clone:
  git:
    image: woodpeckerci/plugin-git:2
    settings:
      lfs: true
      recursive: false

steps:
  # The same build GitHub Actions runs before deploying Pages (.github/workflows/pages.yml):
  # raw SQL in data/sql -> in-memory SQLite -> VitePress -> dist-pages, then the output checks.
  # This lane gates PRs and branches; GitHub Actions alone deploys Pages from main.
  # No database credentials or deployment action belongs here; the public site never reads PostgreSQL.
  - name: pages-build
    image: bash
    commands:
      # Local backend: the pinned host node (Node 24, provides node:sqlite).
      - export PATH=/opt/linalab/node/bin:$PATH
      - cd site && npm ci --no-audit --no-fund && cd ..
      - SITE_BASE=/ SITE_REPO_URL=https://github.com/islee23520/seoul-dengoku-wiki node site/build.mjs
      - SITE_BASE=/ node site/check-site.mjs
