name: Cast SQLite checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cast-sqlite:
    name: Test cast SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test cast SQLite
        run: npm run test:cast-sqlite
