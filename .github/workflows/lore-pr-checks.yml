name: Lore PR checks

on:
  pull_request:
    branches:
      - main

jobs:
  lore-pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Python validator dependency
        run: python -m pip install jsonschema

      - name: Test lore JSON validator
        run: npm run test:lore-json

      - name: Validate changed lore JSON
        run: node scripts/lore-json-validate.mjs
