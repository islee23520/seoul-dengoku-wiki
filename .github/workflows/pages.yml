name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ['data/sql/**', 'site/**', 'scripts/pages/release-notes.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags: the Update History page is generated from them
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/configure-pages@v6
        id: pages
      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Build from raw SQL
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: node site/build.mjs
      - name: Check output
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: node site/check-site.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # One release per deployed merge on main. The git tag vX.Y.Z is the version source; nothing is committed back.
  # Idempotent: publish exits 0 without creating anything when HEAD is already tagged or contained in a release tag.
  release:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/pages/release-notes.mjs publish --repo-url "${{ github.server_url }}/${{ github.repository }}"
