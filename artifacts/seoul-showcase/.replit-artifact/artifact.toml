kind = "web"
previewPath = "/seoul-showcase/"
title = "서울:전국 — Seoul Subway States"
description = "A standalone bilingual visual novel introduction to Seoul Subway States, with branching faction choices, English subtitles and selectable Korean or English narration."
version = "1.0.0"
id = "artifacts/seoul-showcase"
router = "path"

[[services]]
name = "web"
paths = [ "/seoul-showcase/" ]
localPort = 20814

[services.development]
run = "pnpm --filter @workspace/seoul-showcase run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seoul-showcase", "run", "build" ]
serve = "static"
publicDir = "artifacts/seoul-showcase/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20814"
BASE_PATH = "/seoul-showcase/"
