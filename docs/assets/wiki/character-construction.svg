<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F6F4EF"/><text x="640" y="55" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#172A46">2.5등신 하이브리드 캐릭터 규격</text><g stroke="#d0cec7" stroke-width="1"> <path d="M100 620H1180M100 520H1180M100 420H1180M100 320H1180M100 220H1180M100 120H1180"/><path d="M200 90V650M300 90V650M400 90V650M500 90V650M600 90V650M700 90V650M800 90V650M900 90V650M1000 90V650M1100 90V650"/></g><g font-family="sans-serif" text-anchor="middle"><text x="220" y="115" font-size="23" fill="#172A46">고정 카메라</text><text x="220" y="150" font-size="20" fill="#172A46">Yaw 45° · Pitch 35.264°</text><path d="M250 180 L400 280" stroke="#C84D4D" stroke-width="8" marker-end="url(#e)"/><circle cx="640" cy="245" r="115" fill="#356FB6"/><text x="640" y="245" font-size="30" fill="white">도트 헤드</text><text x="640" y="285" font-size="22" fill="white">정체성 · 표정 · 4방향</text><path d="M540 355 Q640 320 740 355 L800 575 Q640 640 480 575 Z" fill="#2E8C87"/><text x="640" y="455" font-size="30" fill="white">메시 바디</text><text x="640" y="500" font-size="22" fill="white">동작 · 장비 · 그림자</text><rect x="440" y="610" width="400" height="55" fill="#172A46"/><text x="640" y="647" font-size="23" fill="white">한 캐릭터 = 1.5m 타일 하나</text><text x="1010" y="245" font-size="22" fill="#172A46">북 · 동 · 남 · 서</text><text x="1010" y="285" font-size="22" fill="#172A46">네 방향 전용 표현</text></g><defs><marker id="e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C84D4D"/></marker></defs></svg>
