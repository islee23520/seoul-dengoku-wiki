<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F6F4EF"/><text x="640" y="55" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#172A46">4방향 이동과 조우 결정 구조</text><g font-family="sans-serif" font-size="22" text-anchor="middle"><rect x="70" y="270" width="190" height="110" rx="18" fill="#356FB6"/><text x="165" y="315" fill="white">4방향 입력</text><text x="165" y="350" fill="white">한 타일 행동</text><rect x="330" y="270" width="230" height="110" rx="18" fill="#2E8C87"/><text x="445" y="310" fill="white">이동 검증</text><text x="445" y="345" fill="white">부상 · 보급 · 통행권</text><rect x="630" y="270" width="230" height="110" rx="18" fill="#172A46"/><text x="745" y="310" fill="white">조우 생성</text><text x="745" y="345" fill="white">시드 · 소음 · 시간 · 세력</text><rect x="930" y="120" width="260" height="90" rx="18" fill="#2E8C87"/><text x="1060" y="175" fill="white">교섭 · 거래 · 작업 · 우회</text><rect x="930" y="440" width="260" height="90" rx="18" fill="#C84D4D"/><text x="1060" y="495" fill="white">동일 격자 SRPG 전투</text></g><g stroke="#1E2228" stroke-width="6" fill="none" marker-end="url(#g)"><line x1="260" y1="325" x2="330" y2="325"/><line x1="560" y1="325" x2="630" y2="325"/><path d="M860 300 Q900 190 930 170"/><path d="M860 350 Q900 460 930 485"/></g><path d="M445 380 Q445 565 165 565 Q95 565 95 380" fill="none" stroke="#C84D4D" stroke-width="5" stroke-dasharray="10 8"/><text x="300" y="610" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#C84D4D">불법·대각선·봉쇄 이동은 행동 소비 없이 거부</text><defs><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1E2228"/></marker></defs></svg>
