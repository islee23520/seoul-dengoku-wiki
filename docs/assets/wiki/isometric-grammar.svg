<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F6F4EF"/>
  <text x="640" y="48" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#172A46">고정 아이소메트릭 CRPG 공간 문법</text>
  <text x="640" y="82" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1E2228">탐색 · 상호작용 · 전투가 동일한 1.5m 4방향 타일 격자를 사용</text>

  <g transform="translate(270 345)">
    <text x="0" y="-235" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172A46">타일 점유</text>
    <g transform="scale(1 .55) rotate(45)" stroke="#172A46" stroke-width="2">
      <rect x="-170" y="-170" width="340" height="340" fill="#E5E1D8"/>
      <path d="M-170 -85H170M-170 0H170M-170 85H170M-85 -170V170M0 -170V170M85 -170V170" fill="none"/>
      <rect x="-85" y="-85" width="85" height="85" fill="#2E8C87"/>
      <rect x="0" y="0" width="85" height="85" fill="#356FB6"/>
    </g>
    <circle cx="-35" cy="-25" r="34" fill="#2E8C87" stroke="#172A46" stroke-width="4"/>
    <path d="M-35 -48L-18 -15L-52 -15Z" fill="#F6F4EF"/>
    <text x="0" y="205" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1E2228">일반 인물 1명 = 타일 1칸</text>
    <text x="0" y="234" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1E2228">표준 통로 = 최소 2칸 폭</text>
  </g>

  <g transform="translate(640 345)">
    <text x="0" y="-235" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172A46">4방향 페이싱</text>
    <polygon points="0,-170 170,-70 0,30 -170,-70" fill="#E5E1D8" stroke="#172A46" stroke-width="3"/>
    <circle cx="0" cy="-70" r="45" fill="#356FB6" stroke="#172A46" stroke-width="4"/>
    <path d="M0 -105L22 -62L-22 -62Z" fill="#F6F4EF"/>
    <g stroke="#C84D4D" stroke-width="7" marker-end="url(#arrow)">
      <line x1="0" y1="-120" x2="0" y2="-190"/>
      <line x1="48" y1="-70" x2="125" y2="-70"/>
      <line x1="0" y1="-20" x2="0" y2="55"/>
      <line x1="-48" y1="-70" x2="-125" y2="-70"/>
    </g>
    <g font-family="sans-serif" font-size="20" font-weight="700" fill="#172A46" text-anchor="middle">
      <text x="0" y="-208">북</text><text x="150" y="-63">동</text><text x="0" y="88">남</text><text x="-150" y="-63">서</text>
    </g>
    <text x="0" y="205" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1E2228">이동 방향과 몸·머리·무기 방향이 일치</text>
    <text x="0" y="234" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1E2228">대각선 입력과 임의 회전 없음</text>
  </g>

  <g transform="translate(1010 345)">
    <text x="0" y="-235" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172A46">시야 구조</text>
    <g transform="scale(1 .55) rotate(45)" stroke="#172A46" stroke-width="2">
      <rect x="-170" y="-170" width="340" height="340" fill="#E5E1D8"/>
      <path d="M-170 -85H170M-170 0H170M-170 85H170M-85 -170V170M0 -170V170M85 -170V170" fill="none"/>
      <path d="M-85 0L170 -85L170 85Z" fill="#2E8C87" opacity=".42"/>
      <rect x="0" y="-85" width="85" height="85" fill="#C84D4D"/>
    </g>
    <circle cx="-85" cy="-47" r="30" fill="#356FB6" stroke="#172A46" stroke-width="4"/>
    <path d="M-85 -68L-68 -38L-102 -38Z" fill="#F6F4EF"/>
    <rect x="15" y="-103" width="60" height="105" fill="#172A46"/>
    <path d="M75 -55L160 -90L160 20L75 -5Z" fill="#C84D4D" opacity=".28"/>
    <text x="0" y="205" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1E2228">가시 타일은 청록, 차단 뒤는 적색</text>
    <text x="0" y="234" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1E2228">기둥·벽·차량이 시야와 사격선을 차단</text>
  </g>

  <text x="640" y="690" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172A46">카메라: 직교 · Yaw 45° · Pitch 35.264° · 자유 회전 및 별도 전투 카메라 없음</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C84D4D"/></marker></defs>
</svg>
