<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F6F4EF"/><text x="640" y="55" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#172A46">개발 단계와 중단 가능한 검증 게이트</text><g font-family="sans-serif" font-size="20" text-anchor="middle"><g fill="#356FB6"><rect x="55" y="235" width="170" height="105" rx="18"/><rect x="300" y="235" width="170" height="105" rx="18"/><rect x="545" y="235" width="170" height="105" rx="18"/><rect x="790" y="235" width="170" height="105" rx="18"/><rect x="1035" y="235" width="190" height="105" rx="18"/></g><text x="140" y="275" fill="white">기반 계약</text><text x="140" y="310" fill="white">Unity · 문서</text><text x="385" y="275" fill="white">세계 · 시뮬레이션</text><text x="385" y="310" fill="white">결정론 검증</text><text x="630" y="275" fill="white">이동 · 전투</text><text x="630" y="310" fill="white">왕복 정산</text><text x="875" y="275" fill="white">캐릭터 · 자산</text><text x="875" y="310" fill="white">실제 캡처</text><text x="1130" y="275" fill="white">통합 슬라이스</text><text x="1130" y="310" fill="white">전체 사용 흐름</text></g><g stroke="#1E2228" stroke-width="5" marker-end="url(#c)"><line x1="225" y1="287" x2="300" y2="287"/><line x1="470" y1="287" x2="545" y2="287"/><line x1="715" y1="287" x2="790" y2="287"/><line x1="960" y1="287" x2="1035" y2="287"/></g><g font-family="sans-serif" font-size="20" text-anchor="middle"><rect x="275" y="450" width="730" height="105" rx="20" fill="#C84D4D"/><text x="640" y="490" fill="white" font-size="27">각 단계의 실패는 다음 단계 진입을 차단</text><text x="640" y="530" fill="white">회귀를 숨기는 예외 대신 더 단순한 대안으로 되돌아감</text></g><defs><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1E2228"/></marker></defs></svg>
