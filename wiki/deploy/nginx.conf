server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Every deploy can replace HTML, JSON, images, and standalone sub-pages in
    # place. Prevent browsers and Cloudflare from serving a previous release.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location = /wiki {
        return 308 https://$host/wiki/;
    }

    location /wiki/assets/ {
        # Vite content-hashes these files, so a new release gets a new URL.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /wiki/wiki-assets/ {
        try_files $uri =404;
    }

    location = /wiki/ {
        try_files /wiki/index.html =404;
    }

    location /wiki/ {
        try_files $uri /wiki/index.html;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
