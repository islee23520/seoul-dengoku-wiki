server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    location = /wiki {
        return 308 https://$host/wiki/;
    }

    location /wiki/assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location /wiki/wiki-assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location = /wiki/ {
        try_files /wiki/index.html =404;
    }

    location /wiki/ {
        try_files $uri /wiki/index.html;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
