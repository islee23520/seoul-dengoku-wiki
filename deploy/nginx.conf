server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Every deploy can replace HTML, JSON, images, and standalone sub-pages in
    # place. Prevent browsers and Cloudflare from serving a previous release.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location = /wiki {
        return 308 https://$host/wiki/;
    }

    # Wiki data API (server/wiki-api.mjs). Resolved per request so nginx still starts
    # while the API container is down.
    location ^~ /wiki/api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $wiki_api_backend wiki-api:8787;
        proxy_pass http://$wiki_api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /wiki/assets/ {
        # Vite content-hashes these files, so a new release gets a new URL.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /wiki/wiki-assets/ {
        try_files $uri =404;
    }

    location = /wiki/ {
        try_files /wiki/index.html =404;
    }

    location /wiki/ {
        try_files $uri /wiki/index.html;
    }

    location = /regions {
        return 308 /wiki/regions;
    }

    location /regions/ {
        return 308 /wiki$request_uri;
    }

    location = /world/regions {
        return 308 /wiki/world/regions;
    }

    location /world/regions/ {
        return 308 /wiki$request_uri;
    }

    location = /gdd {
        return 308 https://$host/gdd/;
    }

    location /gdd/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /gdd/ {
        try_files /gdd/index.html =404;
    }

    location /gdd/ {
        try_files $uri /gdd/index.html;
    }

    location = /system-design/regions {
        return 308 /wiki/world/World-and-Subway-Layers;
    }

    location = /system-design/regions/ {
        return 308 /wiki/world/World-and-Subway-Layers;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
